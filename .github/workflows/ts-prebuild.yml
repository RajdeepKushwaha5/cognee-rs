name: TS Prebuild

# Build per-platform prebuilt .node binaries and publish per-platform npm
# packages (@cognee/neon-<platform>) on release tags, then publish the main
# `cognee-ts` npm package once all platform packages are live.
#
# The matrix matches the entries in:
#   ts/package.json           (optionalDependencies)
#   ts/src/native.ts          (platforms map)
#   ts/scripts/postinstall.js (PLATFORM_PACKAGES map)
#   ts/platform-packages/     (one sub-directory per platform)
#
# N-API version: napi-6 (Node >= 14.6 / 16.0), matching the neon crate
# configuration in ts/cognee-ts-neon/Cargo.toml (`napi-6` feature).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Manual trigger: build all platforms and publish whichever are missing,
  # without needing a version bump / new tag. The publish steps are
  # idempotent (skip-if-already-on-registry), so re-running is safe.
  workflow_dispatch:
  # Also on PRs that change the Linux build environment or the glibc floor,
  # so a change to either is proven on the real release legs before merge
  # instead of on the next tag (Linux legs only — see the `plan` job).
  # Everything that publishes is skipped on
  # pull_request (see the publish/release job conditions).
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/ts-prebuild.yml"
      - "bindings/Cross.toml"
      - "ci/cross/**"
      - "ci/assert-glibc-floor.sh"
      - "ci/linux-glibc-floor.txt"

# Least privilege: nothing here writes to the repository. Publishing
# authenticates to npm / Maven Central with its own secrets, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ts-prebuild-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  ORT_CACHE_DIR: ${{ github.workspace }}/target/ort-cache
  CCACHE_COMPILERCHECK: content

jobs:
  # ── Plan: which legs to build ────────────────────────────────────────
  # The matrix lives here, not inline in `build-platform`, so it can depend on
  # the event: tag pushes and dispatches build every leg; pull_request (which
  # only fires for changes to the Linux build environment, see `on:`) builds
  # just the Linux legs, since nothing those paths control can affect the
  # macOS / Windows legs and those are the slowest, coldest builds. A job-level
  # `if:` cannot see `matrix`, and `exclude` cannot remove `include`-only
  # entries, hence a job output. Each leg is one JSON object below; the
  # comments are the reasons each leg looks the way it does.
  plan:
    name: Plan build legs
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - id: legs
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # linux-x64-gnu:
          #   Linux x64 glibc — also via `cross`, in the pinned ubuntu:24.04 image
          #   (ci/cross/x86_64-gnu.Dockerfile), NOT natively on the runner: a
          #   native build takes its glibc floor from the runner image, which
          #   moved to glibc 2.43 when ubuntu-latest became 26.04. The floor is
          #   recorded in ci/linux-glibc-floor.txt and asserted after the build.
          # linux-arm64-gnu:
          #   Linux arm64 glibc — cross via `cross`
          # darwin-arm64:
          #   NOTE: no darwin-x64 (x86_64-apple-darwin) leg. Intel macOS is EOL
          #   (GitHub retires its last x86_64 runner in 2027) and `ort` ships no
          #   prebuilt ONNX Runtime for x86_64-apple-darwin, so the addon can't
          #   link without building ONNX Runtime from source. The package was
          #   never published; dropped rather than carry a permanently-red leg.
          #   macOS arm64 (Apple Silicon). Use macos-15 (default Xcode 16.4):
          #   the older macos-14 default (Xcode 15.4) ships a libc++ whose
          #   std::construct_at trips a C++20 aggregate-init bug while compiling
          #   lbug's bundled C++ (needs Clang 16+ / P0960 support).
          # win32-x64-msvc:
          #   Windows x64
          legs=$(jq -c -s . <<'EOF'
          {"platform": "linux-x64-gnu", "runner": "ubuntu-24.04", "rust-target": "x86_64-unknown-linux-gnu", "cross": true}
          {"platform": "linux-arm64-gnu", "runner": "ubuntu-24.04", "rust-target": "aarch64-unknown-linux-gnu", "cross": true}
          {"platform": "darwin-arm64", "runner": "macos-15", "rust-target": "aarch64-apple-darwin", "cross": false}
          {"platform": "win32-x64-msvc", "runner": "windows-latest", "rust-target": "x86_64-pc-windows-msvc", "cross": false}
          EOF
          )
          if [ "$EVENT" = pull_request ]; then
            legs=$(jq -c '[.[] | select(.["rust-target"] | test("linux"))]' <<<"$legs")
          fi
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          jq . <<<"$legs"

  # ── Build per-platform .node artifacts ───────────────────────────────
  build-platform:
    name: Build ${{ matrix.platform }}
    # Cap each leg so a stuck build (e.g. a hung native compile) fails fast
    # instead of running to the 6h/24h default and burning runner time.
    #
    # 150, not 90: at 0.2.0 the win32-x64-msvc leg was cancelled at 90m59s while
    # still legitimately compiling (ort + lbug's bundled C++ + lancedb on a cold
    # cache), which left @cognee/neon-win32-x64-msvc unpublished. It built fine at
    # 0.1.3, so this is dependency-graph growth rather than a hang — the cap needs
    # headroom above the real build time, not a tighter leash.
    timeout-minutes: 150
    needs: plan
    strategy:
      fail-fast: false
      # Legs and their rationale: the `plan` job above.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # Install cross for cross-compilation jobs.
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # No Linux native-deps / mold steps: both Linux legs build inside the
      # cross images (ci/cross/*.Dockerfile), which carry cmake, protoc and the
      # compilers themselves.

      # cmake + protoc on macOS.
      - name: Install native build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake protobuf

      # cmake + protoc on Windows.
      - name: Install native build deps (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake protoc --no-progress

      # lbug (a Kùzu fork) forces the CMake "Ninja" generator, and Ninja+MSVC
      # does NOT search for the compiler — cl.exe/link.exe must already be on
      # PATH via the MSVC developer environment. Without it the build fails with
      # `ninja: CreateProcess: %1 is not a valid Win32 application`. This is the
      # GitHub-hosted equivalent of the `vcvars64.bat` call Kùzu's own Windows
      # CI uses; it exports the MSVC env to all subsequent steps.
      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Two Windows-only build-env fixes:
      #
      # 1. .cargo/config.toml routes the bundled CMake C/C++ build through
      #    scripts/ccache-launcher.sh, a POSIX sh script. Ninja can't
      #    CreateProcess a .sh on Windows (`%1 is not a valid Win32
      #    application`). Clear the launcher so CMake invokes cl.exe directly —
      #    a set env var overrides the non-forced [env] in config.toml, and
      #    ccache isn't installed on the Windows runner anyway.
      #
      # 2. CRT mismatch: lbug compiles its C++ with /MD (dynamic CRT, matching
      #    Rust's msvc default), but esaxx-rs hardcodes `.static_crt(true)` ->
      #    /MT, so linking the addon fails with LNK2038/LNK1319. Force /MD for
      #    cc-built C++ deps via target-scoped CXXFLAGS/CFLAGS (cc appends env
      #    flags last, so /MD wins over esaxx's /MT at cl.exe). Target-scoped so
      #    host build-script compiles are untouched.
      - name: Configure Windows C/C++ build env
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=" >> "$GITHUB_ENV"
          echo "CFLAGS_x86_64_pc_windows_msvc=/MD" >> "$GITHUB_ENV"
          echo "CXXFLAGS_x86_64_pc_windows_msvc=/MD" >> "$GITHUB_ENV"

      # macOS only: the Linux legs compile in cross containers, which cannot
      # see the runner's ccache (scripts/ccache-launcher.sh passes through).
      - name: ccache (lbug bundled C++)
        if: runner.os == 'macOS'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx-${{ matrix.platform }}
          max-size: 1G
          save: true

      # cognee-ts-neon is a member of the bindings/ workspace (shared with
      # cognee-java-jni), so its build output lands in bindings/target.
      - name: Cache cargo (bindings workspace)
        uses: Swatinem/rust-cache@v2
        with:
          # v3: linux-x64-gnu moved from a native runner build to cross.
          shared-key: ts-neon-${{ matrix.platform }}-v3
          workspaces: bindings -> target
          cache-on-failure: true

      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: bindings/target/ort-cache
          key: ort-v2.0.0-rc.13-cpu-${{ matrix.platform }}
        env:
          # Point ort-sys at the bindings workspace's target dir.
          ORT_CACHE_DIR: ${{ github.workspace }}/bindings/target/ort-cache
      # A restored ORT cache that lost its libonnxruntime.a still makes ort-sys
      # skip the download; the failure then surfaces minutes later as the bare
      # rustc error "could not find native static library `onnxruntime`". Drop any
      # empty dist dir so ort-sys re-downloads -- and so this job's post-step
      # cannot persist the empty skeleton under the ORT key. Full write-up in
      # ci/ort/ensure-cache-usable.sh.
      - name: Ensure the restored ORT cache is usable
        shell: bash
        run: bash ci/ort/ensure-cache-usable.sh bindings/target/ort-cache

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dependencies (no scripts to avoid recursive postinstall)
        working-directory: ts
        run: npm install --ignore-scripts

      # Seed ort-sys's download cache from the cognee-hosted ONNX Runtime mirror
      # so the build does not depend on cdn.pyke.io, which (via Cloudflare) 403s
      # GitHub Actions runner IPs on ort-cache misses. Best-effort: on any
      # failure the script exits 0 and the build falls back to the normal pyke
      # download. Runs on the host and seeds the same dir both build steps use —
      # the cross container sees it via its /target mount (ORT_CACHE_DIR maps to
      # /target/ort-cache). Windows path handling differs, and the Windows leg
      # was unaffected; wire it in if that changes. See docs/ci/ort-mirror.md.
      - name: Prefetch ONNX Runtime from mirror
        if: runner.os != 'Windows'
        shell: bash
        run: ci/ort/prefetch.sh "${{ matrix.rust-target }}" "${{ github.workspace }}/bindings/target/ort-cache"

      # Build the Neon cdylib for the target platform.
      #
      # Run from the workspace root (bindings/) with an explicit `-p`, not from
      # the crate dir: the workspace root is where cross-rs looks for Cross.toml
      # and what it mounts, and it is the only member selector that keeps the
      # java cdylib out of this build.
      - name: Build Neon addon (native)
        if: "!matrix.cross"
        working-directory: bindings
        env:
          ORT_CACHE_DIR: ${{ github.workspace }}/bindings/target/ort-cache
        run: cargo build --release -p cognee-ts-neon --target ${{ matrix.rust-target }}

      - name: Build Neon addon (cross)
        if: matrix.cross
        working-directory: bindings
        # bindings/Cross.toml mounts the whole repo (volumes=COGNEE_REPO_ROOT)
        # so the workspace's ../ts, ../java and ../crates path-deps resolve in
        # the container, and selects the pinned build image per target
        # (ci/cross/*.Dockerfile). cross mounts the workspace target at
        # /target. On arm64, disable simsimd's advanced ARM SIMD kernels (SVE /
        # NEON-bf16) the cross toolchain can't assemble.
        env:
          ORT_CACHE_DIR: /target/ort-cache
          COGNEE_REPO_ROOT: ${{ github.workspace }}
        run: |
          if [ "${{ matrix.rust-target }}" = aarch64-unknown-linux-gnu ]; then
            SVE="-DSIMSIMD_TARGET_NEON_I8=0 -DSIMSIMD_TARGET_NEON_F16=0 -DSIMSIMD_TARGET_NEON_BF16=0 -DSIMSIMD_TARGET_SVE=0 -DSIMSIMD_TARGET_SVE_I8=0 -DSIMSIMD_TARGET_SVE_F16=0 -DSIMSIMD_TARGET_SVE_BF16=0 -DSIMSIMD_TARGET_SVE2=0"
            export CFLAGS_aarch64_unknown_linux_gnu="$SVE" CXXFLAGS_aarch64_unknown_linux_gnu="$SVE"
          fi
          cross build --release -p cognee-ts-neon --target ${{ matrix.rust-target }}

      # Copy the built artifact into the platform package directory.
      - name: Copy artifact (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          TARGET_DIR="bindings/target/${{ matrix.rust-target }}/release"
          DEST="ts/platform-packages/${{ matrix.platform }}/cognee_ts_neon.node"
          # Prefer .so (Linux), then .dylib (macOS).
          for candidate in \
            "${TARGET_DIR}/libcognee_ts_neon.so" \
            "${TARGET_DIR}/libcognee_ts_neon.dylib"; do
            if [ -f "$candidate" ]; then
              cp "$candidate" "$DEST"
              echo "Copied $candidate -> $DEST"
              break
            fi
          done
          if [ ! -f "$DEST" ]; then
            echo "error: could not find Neon cdylib in $TARGET_DIR" >&2
            exit 1
          fi

      # The promised glibc / libstdc++ floor for this target
      # (ci/linux-glibc-floor.txt), checked on the artifact itself, so a build
      # image or dependency change that raises it fails here instead of
      # shipping a library that will not load on older distros.
      - name: Assert the glibc floor (Linux)
        if: runner.os == 'Linux'
        run: bash ci/assert-glibc-floor.sh --target ${{ matrix.rust-target }} ts/platform-packages/${{ matrix.platform }}/cognee_ts_neon.node

      - name: Copy artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = "bindings/target/${{ matrix.rust-target }}/release/cognee_ts_neon.dll"
          $dst = "ts/platform-packages/${{ matrix.platform }}/cognee_ts_neon.node"
          Copy-Item $src $dst -Force
          Write-Host "Copied $src -> $dst"

      # Upload the .node file as a workflow artifact so the publish job can
      # download all of them atomically.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-${{ matrix.platform }}
          path: ts/platform-packages/${{ matrix.platform }}/cognee_ts_neon.node
          retention-days: 7

  # The `secrets` context is NOT available in a job-level `if:` (GitHub rejects
  # the whole workflow file as invalid). Read the token in a step instead and
  # surface a boolean output the publish job can gate on.
  check-token:
    name: Check npm token
    runs-on: ubuntu-24.04
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Publish per-platform packages, then the main package ─────────────
  publish:
    name: Publish npm packages
    needs: [build-platform, check-token]
    runs-on: ubuntu-24.04
    # Env-guarded per the token-gate pattern. NPM_TOKEN is T17 scope
    # (registry publish — irreversible, gated on F8 + explicit human "go").
    # Pre-T17 the secret is intentionally absent on cognee-rs so this job
    # silently skips (gated on the check-token precheck output, since `secrets`
    # cannot be used in a job `if:`) and the tag-trigger only exercises the
    # build-platform matrix above (which still warms the cache + verifies
    # cross-compile).
    # always(): publish whatever platforms built, even if some matrix legs fail
    # (not every platform's cross toolchain is solved yet). Publishing is
    # idempotent and skips platforms whose artifact is absent.
    #
    # Never on pull_request: PR runs (path-filtered, see `on:`) only prove the
    # build legs.
    if: ${{ always() && github.event_name != 'pull_request' && needs.check-token.outputs.has_token == 'true' }}

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (with npm auth)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Download all platform .node artifacts into their package directories.
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: neon-*
          path: /tmp/neon-artifacts
          merge-multiple: false

      # A missing artifact is a HARD FAILURE, not a warning.
      #
      # This used to `echo "WARNING: artifact missing"` and carry on, which is how
      # 0.2.0 shipped broken: the win32-x64-msvc leg timed out, its .node was never
      # produced, the platform publish logged "SKIP win32-x64-msvc: no .node built"
      # — and then @cognee/cognee-ts@0.2.0 published anyway as `latest`, pinning an
      # exact optionalDependency on @cognee/neon-win32-x64-msvc@0.2.0 that did not
      # exist. Windows installs succeeded (the dep is *optional*) and then failed at
      # runtime with no native addon. java-prebuild.yml already gets this right via
      # its "Verify all four classifier jars are present" gate; this mirrors it.
      #
      # Publishing an incomplete platform set is never correct — better to ship
      # nothing and re-dispatch than to leave a broken `latest` on the registry.
      - name: Place artifacts into platform package directories
        run: |
          missing=0
          for PLATFORM in \
            linux-x64-gnu linux-arm64-gnu \
            darwin-arm64 \
            win32-x64-msvc; do
            SRC="/tmp/neon-artifacts/neon-${PLATFORM}/cognee_ts_neon.node"
            DEST="ts/platform-packages/${PLATFORM}/cognee_ts_neon.node"
            if [ -f "$SRC" ]; then
              cp "$SRC" "$DEST"
              echo "Placed $DEST"
            else
              echo "::error::artifact missing for ${PLATFORM} — its build leg did not produce cognee_ts_neon.node. Refusing to publish an incomplete platform set."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

      # Publish each platform package.
      - name: Publish platform packages
        working-directory: ts/platform-packages
        run: |
          for PLATFORM in \
            linux-x64-gnu linux-arm64-gnu \
            darwin-arm64 \
            win32-x64-msvc; do
            PKG="@cognee/neon-${PLATFORM}"
            VER=$(node -p "require('./${PLATFORM}/package.json').version")
            if [ ! -f "${PLATFORM}/cognee_ts_neon.node" ]; then
              echo "SKIP ${PLATFORM}: no .node built" >&2
            elif npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
              echo "SKIP ${PKG}@${VER}: already on registry"
            else
              echo "--- Publishing ${PKG}@${VER} ---"
              # `./` prefix so npm treats the arg as a directory to pack, not a
              # package spec to fetch (a bare `linux-x64-gnu` → E404 GET /linux-x64-gnu).
              npm publish "./${PLATFORM}" --access public
            fi
          done

      # Build JS (TypeScript) for the main package.
      - name: Install JS deps (no scripts)
        working-directory: ts
        run: npm install --ignore-scripts

      - name: Build TypeScript
        working-directory: ts
        env:
          COGNEE_SKIP_POSTINSTALL: "1"
        run: npm run build:ts

      # Gate the main package on every platform pin being resolvable.
      #
      # ts/package.json pins each @cognee/neon-* optionalDependency to an EXACT
      # version. If one of them is not on the registry, `npm install` still succeeds
      # (optional deps fail soft) and then breaks at runtime when the addon can't be
      # loaded. So the main package must not go live until all four are published —
      # checked against the registry rather than the local artifacts, since a
      # platform publish can also fail for registry-side reasons.
      - name: Verify every platform package is on the registry
        working-directory: ts
        run: |
          VER=$(node -p "require('./package.json').version")
          missing=0
          for PLATFORM in \
            linux-x64-gnu linux-arm64-gnu \
            darwin-arm64 \
            win32-x64-msvc; do
            PKG="@cognee/neon-${PLATFORM}"
            if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
              echo "ok ${PKG}@${VER}"
            else
              echo "::error::${PKG}@${VER} is not on the registry — @cognee/cognee-ts@${VER} pins it exactly and would install broken on that platform."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

      # Publish the main cognee-ts package (idempotent: skip if already on registry).
      - name: Publish cognee-ts
        working-directory: ts
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@cognee/cognee-ts@${VER}" version >/dev/null 2>&1; then
            echo "SKIP @cognee/cognee-ts@${VER}: already on registry"
          else
            echo "--- Publishing @cognee/cognee-ts@${VER} ---"
            npm publish --access public
          fi
